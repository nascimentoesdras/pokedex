<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="./assets/img/fav.ico" type="image/x-icon">

    <!-- Chart.js -->
     <script src="
        https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js
    " defer></script>

    <!-- Scripts -->
    <script src="./js/app.js" type="module" defer></script>

    <!-- Devicon -->
    <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />

    <!-- Animate CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Page Title -->
    <title>PokeDex</title>
</head>

<body>
    <nav class="navbar">
        <div class="logo-container">
            <img class="logo" src="./assets/img/logo.svg" alt="Logo da pokedex em formato de pokeball" width="30" height="30">
            <a href="index.html">
                <h1>POKEDEX</h1>
            </a>
        </div>

        <div class="navbar-search-box">
            <input id="input" class="input" type="text" name="pokemon" placeholder="Digite o nome ou ID do Pokémon">
            <button id="search" class="search-btn" type="submit">GO</button>
        </div>

        <div class="navbar-icons">
            <a href="#">
                <i class="devicon-github-original"></i>
            </a>
        </div>
    </nav>
    <div id="app">  
        <div id="results">
            <!-- Resultados serão exibidos aqui -->
        </div>

        <div id="pokemon-details">
            <!-- Dados do Pokémon serão exibidos aqui -->
        </div>
    </div>
</body>
</html>
